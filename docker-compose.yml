version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: research-assistant-db
    environment:
      POSTGRES_DB: research_assistant
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: research-assistant-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # API service configuration (for future docker-compose deployment):
  # api:
  #   build:
  #     context: .
  #     dockerfile: apps/api/Dockerfile
  #   container_name: research-assistant-api
  #   environment:
  #     DATABASE_URL: postgresql://user:password@postgres:5432/research_assistant
  #     REDIS_URL: redis://redis:6379
  #     UPLOAD_BASE_PATH: /app/uploads
  #   volumes:
  #     - ./uploads:/app/uploads  # Persist uploaded files
  #   ports:
  #     - '3001:3000'
  #   depends_on:
  #     - postgres
  #     - redis
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
