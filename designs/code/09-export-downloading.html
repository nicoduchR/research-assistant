<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export Modal - Downloading State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                        "deep-navy": "#140d1b",
                        "warm-gray": "#736b7a",
                        "light-gray": "#a198a8"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900/40 flex items-center justify-center min-h-screen p-4">
<!-- Modal Container -->
<div class="w-full max-w-[600px] bg-background-light dark:bg-background-dark rounded-xl shadow-2xl overflow-hidden flex flex-col">
<!-- Header: PageHeading inspired -->
<div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-800">
<h1 class="text-deep-navy dark:text-white text-[24px] font-bold tracking-tight">Generating Your Export...</h1>
<button class="text-light-gray cursor-not-allowed">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Main Content: EmptyState & BodyText inspired -->
<div class="px-8 pt-10 pb-6 flex flex-col items-center">
<!-- Spinner Loader -->
<div class="mb-8">
<span class="material-symbols-outlined text-primary text-[48px] animate-spin">
                    progress_activity
                </span>
</div>
<!-- Loading Status -->
<div class="text-center space-y-2">
<p class="text-warm-gray dark:text-gray-300 text-lg font-medium leading-normal">
                    Generating PDF with APA citations...
                </p>
<p class="text-light-gray dark:text-gray-500 text-sm font-normal">
                    This will download automatically
                </p>
</div>
</div>
<!-- Progress Section: ProgressBar inspired -->
<div class="px-8 py-4 w-full">
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between items-end">
<p class="text-deep-navy dark:text-gray-200 text-sm font-medium leading-normal">Progress</p>
<p class="text-deep-navy dark:text-gray-200 text-sm font-normal leading-normal">75%</p>
</div>
<div class="w-full rounded-full bg-primary/20 h-2.5">
<div class="h-2.5 rounded-full bg-primary" style="width: 75%;"></div>
</div>
</div>
</div>
<!-- Footer: MetaText inspired -->
<div class="px-8 pb-8 pt-2 flex justify-center">
<p class="text-light-gray dark:text-gray-500 text-xs font-normal uppercase tracking-wider">
                File size: ~450 KB
            </p>
</div>
</div>
<!-- Background Mockup Content (blurred for context) -->
<div class="fixed inset-0 -z-10 bg-background-light dark:bg-background-dark opacity-50 pointer-events-none overflow-hidden">
<div class="max-w-[1200px] mx-auto p-12">
<div class="h-8 w-48 bg-gray-200 dark:bg-gray-800 rounded mb-8"></div>
<div class="grid grid-cols-3 gap-6">
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
<div class="h-64 bg-gray-100 dark:bg-gray-900 rounded-lg"></div>
</div>
</div>
</div>
</body></html>
